name: Deploy Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'ProjectSettings/**'
      - 'Packages/**'
      - 'tools/cloudflare/**'
      - 'tools/web-app/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  build-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Detect Unity changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            unity:
              - 'Assets/**'
              - 'ProjectSettings/**'
              - 'Packages/**'

      - name: Check Unity license secrets
        if: steps.changes.outputs.unity == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ secrets.UNITY_LICENSE }}" ] && { [ -z "${{ secrets.UNITY_EMAIL }}" ] || [ -z "${{ secrets.UNITY_PASSWORD }}" ]; }; then
            echo "::error::Добавьте UNITY_LICENSE (или UNITY_EMAIL + UNITY_PASSWORD) в GitHub Secrets. См. tools/UNITY_WEBGL.md"
            exit 1
          fi

      - name: Free disk space
        if: steps.changes.outputs.unity == 'true' || github.event_name == 'workflow_dispatch'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: false
          haskell: false
          large-packages: true
          swap-storage: false

      - name: Cache Unity Library
        id: library_cache
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-v6-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-v6-

      - name: Restore WebGL output cache
        id: webgl_cache
        uses: actions/cache@v5
        with:
          path: build/WebGL
          key: webgl-v1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Build Unity WebGL
        id: unity_build
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.unity == 'true'
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          customParameters: "-ignoreAudio -nographics"

      - name: Verify WebGL output
        id: webgl_ready
        run: |
          if [ -f build/WebGL/WebGL/index.html ]; then
            echo "WebGL OK: build/WebGL/WebGL/index.html"
            echo "ready=true" >> $GITHUB_OUTPUT
          elif [ -f build/WebGL/index.html ]; then
            echo "WebGL OK: build/WebGL/index.html"
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            if [ "${{ steps.unity_build.outcome }}" = "success" ]; then
              echo "::error::Unity WebGL finished but index.html is missing"
              exit 1
            fi
            echo "::warning::No WebGL build in this run (Unity step skipped and cache miss)"
          fi

      - name: Fail tools-only deploy on WebGL cache miss
        if: steps.webgl_ready.outputs.ready != 'true' && steps.changes.outputs.unity != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::Tools changed but WebGL cache was missed. Run workflow_dispatch (Unity rebuild) once."
          exit 1

      - name: Report WebGL file sizes
        if: steps.webgl_ready.outputs.ready == 'true' && steps.unity_build.outcome == 'success'
        working-directory: tools/cloudflare
        env:
          UNITY_WEBGL_SOURCE: ${{ github.workspace }}/build/WebGL
          WEBGL_SIZE_REPORT: ${{ github.workspace }}/webgl-size-report.txt
        run: node scripts/report-webgl-sizes.mjs

      - name: Save Unity Library cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: Library
          key: ${{ steps.library_cache.outputs.cache-primary-key }}

      - name: Upload Unity logs on failure
        if: failure() && steps.unity_build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: unity-logs-${{ github.run_id }}
          path: |
            Logs
          if-no-files-found: ignore

      - name: Save WebGL output cache
        if: steps.webgl_ready.outputs.ready == 'true'
        uses: actions/cache/save@v5
        with:
          path: build/WebGL
          key: ${{ steps.webgl_cache.outputs.cache-primary-key }}

      - name: Upload WebGL artifact
        if: steps.webgl_ready.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: webgl-build
          path: build/WebGL
          if-no-files-found: warn

  deploy:
    needs: build-webgl
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download WebGL artifact
        id: webgl_artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: webgl-build
          path: build/WebGL

      - name: Restore WebGL cache if artifact missing
        if: steps.webgl_artifact.outcome != 'success'
        uses: actions/cache@v5
        with:
          path: build/WebGL
          key: webgl-v1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/cloudflare/package-lock.json

      - name: Install dependencies
        working-directory: tools/cloudflare
        run: npm ci

      - name: Copy web app and Unity WebGL
        working-directory: tools/cloudflare
        env:
          UNITY_WEBGL_SOURCE: ${{ github.workspace }}/build/WebGL
          REQUIRE_GAME: '1'
          APP_BUILD_ID: ${{ github.sha }}
        run: npm run copy-web-app

      - name: Verify Unity files in public/game
        run: |
          test -f tools/cloudflare/public/game/index.html || (echo "::error::public/game/index.html missing" && exit 1)
          grep -q "unity-container\|createUnityInstance\|UnityLoader" tools/cloudflare/public/game/index.html \
            || echo "::warning::game/index.html may not be a Unity loader (check artifact/cache)"
          test -d tools/cloudflare/public/game/Build || (echo "::error::public/game/Build missing — Unity not deployed" && exit 1)

      - name: Prepare public for Pages (25 MiB limit)
        working-directory: tools/cloudflare
        run: node scripts/prepare-pages-public.mjs

      - name: Verify Cloudflare credentials
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Ensure Pages project exists
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: tpd-arena
          PAGES_PRODUCTION_BRANCH: main
        run: node scripts/ensure-pages-project.mjs

      - name: Ensure Arena KV namespace
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARENA_KV_NAMESPACE_ID: ${{ secrets.ARENA_KV_NAMESPACE_ID }}
        run: node scripts/ensure-arena-kv.mjs

      - name: Ensure Telegram bot Mini App
        working-directory: tools/cloudflare
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEB_APP_URL: https://tpd-arena.pages.dev
        run: node scripts/ensure-telegram-bot.mjs

      - name: Set Telegram bot token on Pages
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler pages secret put TELEGRAM_BOT_TOKEN --project-name=tpd-arena

      - name: Deploy to Cloudflare Pages
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=tpd-arena --branch=main --commit-dirty=true

      - name: Smoke-check deployed build id
        run: |
          DEPLOYED_BUILD_ID=$(curl -fsSL "https://tpd-arena.pages.dev/version.json" | jq -r .buildId)
          if [ "$DEPLOYED_BUILD_ID" != "${{ github.sha }}" ]; then
            echo "::error::Deployed buildId ($DEPLOYED_BUILD_ID) does not match commit (${{ github.sha }})"
            exit 1
          fi

      - name: Register Telegram webhook
        working-directory: tools/cloudflare
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEB_APP_URL: https://tpd-arena.pages.dev
        run: npm run set-webhook
