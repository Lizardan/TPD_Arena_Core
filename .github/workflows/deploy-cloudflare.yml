name: Deploy Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'ProjectSettings/**'
      - 'Packages/**'
      - 'tools/cloudflare/**'
      - 'tools/web-app/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  build-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Detect Unity changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            unity:
              - 'Assets/**'
              - 'ProjectSettings/**'
              - 'Packages/**'

      - name: Check Unity license secrets
        if: steps.changes.outputs.unity == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ secrets.UNITY_LICENSE }}" ] && { [ -z "${{ secrets.UNITY_EMAIL }}" ] || [ -z "${{ secrets.UNITY_PASSWORD }}" ]; }; then
            echo "::error::Добавьте UNITY_LICENSE (или UNITY_EMAIL + UNITY_PASSWORD) в GitHub Secrets. См. tools/UNITY_WEBGL.md"
            exit 1
          fi

      - name: Free disk space
        if: steps.changes.outputs.unity == 'true' || github.event_name == 'workflow_dispatch'
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: false
          haskell: false
          large-packages: true
          swap-storage: false

      - name: Cache Unity Library
        id: library_cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-v6-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-v6-

      - name: Mark Unity build start
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.unity == 'true'
        run: |
          mkdir -p _ci-debug
          TS=$(($(date +%s)*1000))
          echo "{\"sessionId\":\"a89d64\",\"timestamp\":$TS,\"location\":\"workflow:pre-unity\",\"message\":\"unity build starting\",\"hypothesisId\":\"G\",\"data\":{\"builder\":\"v5\",\"customParameters\":\"-ignoreAudio\",\"cacheKey\":\"Library-v6\"}}" >> _ci-debug/debug-a89d64.log

      - name: Build Unity WebGL
        id: unity_build
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.unity == 'true'
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          customParameters: "-ignoreAudio"

      - name: Save Unity Library cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: Library
          key: ${{ steps.library_cache.outputs.cache-primary-key }}

      - name: CI debug diagnostics
        if: always()
        run: |
          mkdir -p _ci-debug
          LIB_MB=0
          if [ -d Library ]; then LIB_MB=$(du -sm Library | cut -f1); fi
          WEBGL_NESTED=false
          WEBGL_FLAT=false
          if [ -f build/WebGL/WebGL/index.html ]; then WEBGL_NESTED=true; fi
          if [ -f build/WebGL/index.html ]; then WEBGL_FLAT=true; fi
          TS=$(($(date +%s)*1000))
          echo "{\"sessionId\":\"a89d64\",\"timestamp\":$TS,\"location\":\"workflow:post-unity\",\"message\":\"post unity build state\",\"hypothesisId\":\"G\",\"data\":{\"libraryCacheHit\":\"${{ steps.library_cache.outputs.cache-hit }}\",\"libraryMb\":$LIB_MB,\"webglNestedIndex\":$WEBGL_NESTED,\"webglFlatIndex\":$WEBGL_FLAT,\"unityOutcome\":\"${{ steps.unity_build.outcome }}\"}}" >> _ci-debug/debug-a89d64.log

      - name: Upload CI debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-a89d64
          path: _ci-debug/debug-a89d64.log
          if-no-files-found: warn

      - name: Upload Unity logs on failure
        if: failure() && steps.unity_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs-${{ github.run_id }}
          path: |
            Logs
          if-no-files-found: ignore

      - name: Upload WebGL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL
          if-no-files-found: warn

  deploy:
    needs: build-webgl
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebGL artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: webgl-build
          path: build/WebGL

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/cloudflare/package-lock.json

      - name: Install dependencies
        working-directory: tools/cloudflare
        run: npm ci

      - name: Copy web app and Unity WebGL
        working-directory: tools/cloudflare
        env:
          UNITY_WEBGL_SOURCE: ${{ github.workspace }}/build/WebGL
        run: npm run copy-web-app

      - name: Verify Cloudflare credentials
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Ensure Pages project exists
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: tpd-arena
          PAGES_PRODUCTION_BRANCH: main
        run: node scripts/ensure-pages-project.mjs

      - name: Ensure Arena KV namespace
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARENA_KV_NAMESPACE_ID: ${{ secrets.ARENA_KV_NAMESPACE_ID }}
        run: node scripts/ensure-arena-kv.mjs

      - name: Set Telegram bot token on Pages
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: echo "$TELEGRAM_BOT_TOKEN" | npx wrangler pages secret put TELEGRAM_BOT_TOKEN --project-name=tpd-arena

      - name: Deploy to Cloudflare Pages
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=tpd-arena --branch=main --commit-dirty=true

      - name: Register Telegram webhook
        working-directory: tools/cloudflare
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEB_APP_URL: https://tpd-arena.pages.dev
        run: npm run set-webhook
