name: Deploy Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'ProjectSettings/**'
      - 'Packages/**'
      - 'tools/cloudflare/**'
      - 'tools/web-app/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  build-webgl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Detect Unity changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            unity:
              - 'Assets/**'
              - 'ProjectSettings/**'
              - 'Packages/**'

      - name: Restore WebGL cache
        uses: actions/cache@v4
        with:
          path: build/WebGL
          key: webgl-${{ hashFiles('Assets/**', 'ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}
          restore-keys: |
            webgl-

      - name: Build Unity WebGL
        if: steps.changes.outputs.unity == 'true' || github.event_name == 'workflow_dispatch'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
          buildsPath: build
          buildName: TPDArena

      - name: Upload WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL
          if-no-files-found: warn

  deploy:
    needs: build-webgl
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/cloudflare/package-lock.json

      - name: Install dependencies
        working-directory: tools/cloudflare
        run: npm ci

      - name: Copy web app and Unity WebGL
        working-directory: tools/cloudflare
        env:
          UNITY_WEBGL_SOURCE: ${{ github.workspace }}/build/WebGL
        run: npm run copy-web-app

      - name: Verify Cloudflare credentials
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Ensure Pages project exists
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: tpd-arena
          PAGES_PRODUCTION_BRANCH: main
        run: node scripts/ensure-pages-project.mjs

      - name: Ensure Arena KV namespace
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARENA_KV_NAMESPACE_ID: ${{ secrets.ARENA_KV_NAMESPACE_ID }}
        run: node scripts/ensure-arena-kv.mjs

      - name: Set Telegram bot token on Pages
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: echo "$TELEGRAM_BOT_TOKEN" | npx wrangler pages secret put TELEGRAM_BOT_TOKEN --project-name=tpd-arena

      - name: Deploy to Cloudflare Pages
        working-directory: tools/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=tpd-arena --branch=main --commit-dirty=true

      - name: Register Telegram webhook
        working-directory: tools/cloudflare
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEB_APP_URL: https://tpd-arena.pages.dev
        run: npm run set-webhook
