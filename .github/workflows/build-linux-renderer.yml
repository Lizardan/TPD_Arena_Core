name: Build Linux Battle Renderer

on:
  push:
    branches: [ main ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/build-linux-renderer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: false
          haskell: false
          large-packages: true
          swap-storage: false

      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-linux-v1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-linux-v1-

      - name: Build Standalone Linux64
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildsPath: build
          buildName: TPD_Arena_Core
          customParameters: -nographics -ignoreAudio

      - name: Upload battle renderer artifact
        uses: actions/upload-artifact@v4
        with:
          name: battle-renderer
          path: build/StandaloneLinux64
          if-no-files-found: error
